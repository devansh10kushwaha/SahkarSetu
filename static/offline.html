<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SahkarSetu — offline</title>
<style>
  body { font-family: Georgia, serif; background: #faf7f2; color: #22301f;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; margin: 0; text-align: center; }
  .box { max-width: 420px; padding: 40px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: #1f6b47;
          color: #fff; font-size: 34px; line-height: 64px; margin: 0 auto 18px; }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { color: #5c6660; line-height: 1.55; }
  button { margin-top: 18px; background: #1f6b47; color: #fff; border: 0;
           padding: 12px 26px; border-radius: 9px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">से</div>
  <h1>इंटरनेट नहीं मिल रहा</h1>
  <p>No internet connection right now. SahkarSetu needs a connection for live
     bookings — check your network and try again.</p>
  <button onclick="location.reload()">फिर कोशिश करें · Retry</button>
</div>
</body>
</html>
